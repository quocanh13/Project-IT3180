<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Sử Cư Trú - Bluemoon Residence</title>
    <link rel="icon" type="image/png" href="/header/images/logo.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./lich-su.css">
</head>
<body>
    <div class="bg-pattern"></div>

    <div id="root"></div>
    <main class="container">
        <header class="content-header">
            <div class="header-left">
                <div class="page-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div>
                    <h1>Lịch Sử Cư Trú</h1>
                    <p class="page-subtitle">Theo dõi lịch sử chuyển đổi căn hộ của cư dân</p>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Căn Hộ Đã Hoạt Động</div>
                    <div class="stat-value" id="totalRooms">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #27ae60 0%, #229954 100%);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Phòng Có Người</div>
                    <div class="stat-value" id="occupiedRooms">0</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        <circle cx="12" cy="8" r="2" fill="white"></circle>
                    </svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Tổng Lượt Cư Trú</div>
                    <div class="stat-value" id="totalHistoryRecords">0</div>
                </div>
            </div>
        </div>

        <div class="search-bar">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <form id="searchForm">
                    <input type="text" id="keyword" placeholder="Tìm kiếm theo số căn hộ, CCCD, họ tên..." />
                </form>
            </div>
            <select id="filterStatus" class="filter-select">
                <option value="">Tất cả trạng thái</option>
                <option value="active">Đang cư trú</option>
                <option value="moved">Đã chuyển đi</option>
            </select>
        </div>

        <section class="table-container" style="background: transparent; box-shadow: none; border: none;">
            
            <div class="table-header-bar" style="border-radius: 12px; margin-bottom: 20px;">
                <h3>Lịch sử cư trú theo căn hộ</h3>
                <span class="table-count" id="tableCount">0 bản ghi</span>
            </div>
            
            <div id="lichSuData" class="room-grid-container">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Đang tải dữ liệu...</span>
                </div>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script type="module" src="./lich-su.mjs"></script>
</body>
</html>
