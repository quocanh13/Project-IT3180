<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lịch sử Căn hộ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="root"></div>
    <div class="container">
        <h2 class="text-center header-title">Quản lý Lịch sử Cư trú</h2>
        <div class="row mb-4 justify-content-center">
            <div class="col-9"></div>
            <div class="col-3 mb-3">
                <form id="searchForm" class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="number" id="keyword" class="form-control form-control-lg" placeholder="Nhập số phòng (VD: 101)...">
                    <button type="submit" class="btn btn-primary btn-lg px-4">Tìm kiếm</button>
                </form>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="py-3 text-center">Số Căn Hộ</th>
                            <th class="py-3">Thông Tin Nhân Khẩu</th>
                            <th class="py-3">Ngày Chuyển Vào</th>
                            <th class="py-3">Ngày Chuyển Đi</th>
                            <th class="py-3 text-center">Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody id="lichSuData">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-5">
                                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                Đang tải dữ liệu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="./lich-su.mjs"></script>

</body>
</html>
