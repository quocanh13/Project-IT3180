<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Khẩu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./nhan-khau.css">
</head>
<body>
    <div id="root"></div>
    <!-- Topbar và Sidebar sẽ được render bởi layout.mjs -->

    <main class="container">
        <header class="content-header">
            <h1>Danh Sách Nhân Khẩu</h1>
            <button class="btn btn-success" onclick="openModal('add')">Thêm Nhân Khẩu Mới</button>
        </header>

            <div class="row">
                <div class="col-9"></div>
                <div class="col-3 mb-3">
                    <form action="" id="searchForm" class="search-form">
                        <input type="text" id="keyword" placeholder="Tìm kiếm theo CCCD, Căn Hộ..." />
                        <button type="submit" class="btn btn-primary">Tìm Kiếm</button>
                    </form>
                </div>
            </div>

        <section class="table-container">
            <table id="nhanKhauTable">
                <thead>
                    <tr>
                        <th>CCCD</th>
                        <th>Họ tên</th>
                        <th>Ngày Sinh</th>
                        <th>Giới Tính</th>
                        <th>Chủ Hộ</th>
                        <th>Quan Hệ Với Chủ Hộ</th>
                        <th>Căn Hộ</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="nhanKhauData">
                    </tbody>
            </table>
        </section>
    </main>

    <div id="nhanKhauModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Nhân Khẩu</h2>
            <form id="nhanKhauForm">
                <div class="form-group">
                    <label>Số CCCD:</label>
                    <input type="text" id="cccd" required>
                </div>
                <div class="form-group">
                    <label>Họ tên:</label>
                    <input type="text" id="hoTen" required>
                </div>
                <div class="form-group">
                    <label>Ngày Sinh:</label>
                    <input type="date" id="ngaySinh" required>
                </div>
                <div class="form-group">
                    <label>Giới Tính:</label>
                    <select id="gioiTinh" required>
                        <option value="">Chọn giới tính</option>
                        <option value="1">Nam</option>
                        <option value="0">Nữ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quốc Tịch:</label>
                    <input type="text" id="quocTich" required>
                </div>
                <div class="form-group">
                    <label>Dân Tộc:</label>
                    <input type="text" id="danToc" required>
                </div>
                <div class="form-group">
                    <label>Quê Quán:</label>
                    <input type="text" id="queQuan" required>
                </div>
                <div class="form-group">
                    <label>Nơi Sinh:</label>
                    <input type="text" id="noiSinh" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script type="module" src="./nhan-khau.mjs"></script>
</body>
</html>
