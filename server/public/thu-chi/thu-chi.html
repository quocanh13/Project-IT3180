<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thu Chi</title>
    <link rel="stylesheet" href="thu-chi.css">
</head>
<body>
    <nav class="topbar">
        <div class="logo">Hệ Thống Quản Lý</div>
        <ul class="nav-links">
            <button class="btn btn-danger">Đăng xuất</button>
        </ul>
    </nav>

    <nav class = "sidebar">
        <a href="../ho-khau/ho-khau.html">
            <div class="sidebar-link">
                <img src = "../images/ho-khau.png">
                <div class = "sidebar-text">Quản lý</div>
                <div class = "sidebar-text">hộ khẩu</div>
            </div>
        </a>
        <a href="../nhan-khau/nhan-khau.html">
            <div class="sidebar-link">
                <img src = "../images/nhan-khau.png">
                <div class = "sidebar-text">Quản lý</div>
                <div class = "sidebar-text">nhân khẩu</div>
            </div>
        </a>
        <a href="#">
            <div class="sidebar-link chosen-link">
                <img src = "../images/thu-chi.png">
                <div class = "sidebar-text chosen-link">Quản lý</div>
                <div class = "sidebar-text chosen-link">thu chi</div>
            </div>
        </a>
    </nav>


    <main class="container">
        <header class="content-header">
            <h1>Danh sách Hộ khẩu</h1>
            <button class="btn btn-primary" onclick="openModal('add')">Thêm Hộ Khẩu Mới</button>
        </header>

        <section class="table-container">
            <table id="hoKhauTable">
                <thead>
                    <tr>
                        <th>CCCD Chủ Hộ</th>
                        <th>Số Nhà</th>
                        <th>Ngày Đăng Ký</th>
                        <th>Số Thành Viên</th>
                        <th>Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="hoKhauData">
                    </tbody>
            </table>
        </section>
    </main>

    <div id="hoKhauModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Hộ Khẩu</h2>
            <form id="hoKhauForm">
                <div class="form-group">
                    <label>Số CCCD Chủ Hộ:</label>
                    <input type="number" id="chuHo" required>
                </div>
                <div class="form-group">
                    <label>Số Nhà:</label>
                    <input type="text" id="soNha" required>
                </div>
                <div class="form-group">
                    <label>Ngày Đăng Ký:</label>
                    <input type="date" id="ngayDK" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./thu-chi.mjs"></script>
</body>
</html>
