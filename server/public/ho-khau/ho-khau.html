<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hộ Khẩu</title>
    <link rel="stylesheet" href="./ho-khau.css">
</head>
<body>
    <nav class="topbar">
        <div class="logo">Hệ Thống Quản Lý</div>
        <ul class="nav-links">
            <button class="btn btn-danger">Đăng xuất</button>
        </ul>
    </nav>

    <nav class = "sidebar">
        <a href="#">
            <div class="sidebar-link chosen-link ho-khau-link">
                <img src = "../images/ho-khau.png">
                <div class = "sidebar-text chosen-link">Quản lý</div>
                <div class = "sidebar-text chosen-link">hộ khẩu</div>
            </div>
        </a>
        <a href="../nhan-khau/nhan-khau.html">
            <div class="sidebar-link">
                <img src = "../images/nhan-khau.png">
                <div class = "sidebar-text">Quản lý</div>
                <div class = "sidebar-text">nhân khẩu</div>
            </div>
        </a>
        <a href="../khoan-thu/khoan-thu.html">
            <div class="sidebar-link">
                <img src = "../images/khoan-thu.png">
                <div class = "sidebar-text">Quản lý</div>
                <div class = "sidebar-text">Khoản thu</div>
            </div>
        </a>
    </nav>


    <main class="container">
        <header class="content-header">
            <h1>Danh sách Hộ khẩu</h1>
            <button class="btn btn-primary" onclick="openModal('add')">Thêm Hộ Khẩu Mới</button>
        </header>

        <section class="table-container">
            <table id="hoKhauTable">
                <thead>
                    <tr>
                        <th>Chủ Hộ</th>
                        <th>CCCD</th>
                        <th>Căn Hộ</th>
                        <th>Ngày Đăng Ký</th>
                        <th>Số Thành Viên</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="hoKhauData">
                    </tbody>
            </table>
        </section>
    </main>

    <div id="hoKhauModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Hộ Khẩu</h2>
            <form id="hoKhauForm">
                <input type="hidden" id="hoKhauId" />
                <div class="form-group">
                    <label>Chủ Hộ:</label>
                    <select id="chuHo" required>
                        <option value="" disabled selected>-- Đang tải danh sách --</option>
                        <!-- Options sẽ được load động từ JavaScript -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Căn Hộ:</label>
                    <input type="text" id="canHo" required>
                </div>
                <div class="form-group">
                    <label>Ngày Đăng Ký:</label>
                    <input type="date" id="ngayDK" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./ho-khau.mjs"></script>
</body>
</html>
