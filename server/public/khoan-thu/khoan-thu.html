<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thu Chi</title>
    <link rel="stylesheet" href="khoan-thu.css">
</head>
<body>
    <nav class="topbar">
        <div class="logo">Hệ Thống Quản Lý</div>
        <ul class="nav-links">
            <button class="btn btn-danger">Đăng xuất</button>
        </ul>
    </nav>

    <nav class="sidebar">
        <a href="../ho-khau/ho-khau.html">
            <div class="sidebar-link">
                <img src="../images/ho-khau.png">
                <div class="sidebar-text">Quản lý</div>
                <div class="sidebar-text">hộ khẩu</div>
            </div>
        </a>
        <a href="../nhan-khau/nhan-khau.html">
            <div class="sidebar-link">
                <img src="../images/nhan-khau.png">
                <div class="sidebar-text">Quản lý</div>
                <div class="sidebar-text">nhân khẩu</div>
            </div>
        </a>
        <a href="#">
            <div class="sidebar-link chosen-link">
                <img src="../images/khoan-thu.png">
                <div class="sidebar-text chosen-link">Quản lý</div>
                <div class="sidebar-text chosen-link">Khoản thu</div>
            </div>
        </a>
    </nav>

    <main class="container">
        <header class="content-header">
            <h1>Danh Sách Khoản Thu</h1>
            <button class="btn btn-primary" onclick="openModal('add')">Thêm Khoản Thu Mới</button>
        </header>

        <section class="table-container">
            <table id="hoKhauTable">
                <thead>
                    <tr>
                        <th>Mã Khoản Thu</th>
                        <th>Tên Khoản Thu</th>
                        <th>Loại Khoản Thu</th>
                        <th>Số Tiền</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="khoanThuData">
                    </tbody>
            </table>
        </section>
    </main>

    <div id="khoanThuModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Khoản Thu</h2>
            <form id="khoanThuForm">
                <div class="form-group">
                    <label>Tên Khoản Thu:</label>
                    <input type="text" id="tenKhoanThu" required>
                </div>
                <div class="form-group">
                    <label>Loại Khoản Thu:</label>
                    <select id="loaiKhoanThu" required>
                        <option value="bắt buộc"> Bắt Buộc </option>
                        <option value="tự nguyện"> Tự Nguyện </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Số Tiền:</label>
                    <input type="number" id="soTien" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./khoan-thu.mjs"></script>
</body>
</html>
